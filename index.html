<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aerolínea Regional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .page { display: none; }
    .page.active { display: block; }
    .flight-card { transition: all 0.3s; }
    .flight-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen font-sans">

  <!-- NAVEGACIÓN -->
  <nav class="bg-blue-700 text-white p-4 shadow-lg sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Aerolínea Regional</h1>
      <div class="space-x-6">
        <a href="#" onclick="show('home')" class="hover:underline">Inicio</a>
        <a href="#" onclick="show('search')" class="hover:underline">Buscar Vuelos</a>
        <a href="#" onclick="show('login')" class="hover:underline">Iniciar Sesión</a>
        <a href="#" onclick="show('register')" class="hover:underline">Registrarse</a>
      </div>
    </div>
  </nav>

  <!-- PÁGINA: INICIO -->
  <div id="home" class="page active text-center py-20 px-6">
    <h2 class="text-5xl font-bold text-blue-800 mb-6">¡Vuela con Nosotros!</h2>
    <p class="text-xl text-gray-700 mb-8">Reserva tu vuelo en minutos. Precios bajos, destinos increíbles.</p>
    <button onclick="show('search')" class="bg-green-600 text-white px-8 py-4 rounded-lg text-xl hover:bg-green-700 transition">
      Buscar Vuelos
    </button>
  </div>

  <!-- PÁGINA: BUSCAR VUELOS -->
  <div id="search" class="page max-w-4xl mx-auto p-6">
    <h2 class="text-3xl font-bold text-center mb-8 text-blue-800">Buscar Vuelos</h2>
    <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
      <div class="grid md:grid-cols-3 gap-4">
        <input type="text" placeholder="Origen" class="p-3 border rounded-lg" value="Ciudad de México">
        <input type="text" placeholder="Destino" class="p-3 border rounded-lg" id="destino">
        <input type="date" class="p-3 border rounded-lg">
      </div>
      <button onclick="buscarVuelos()" class="mt-4 w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
        Buscar
      </button>
    </div>

    <div id="resultados" class="space-y-6">
      <!-- Vuelos se insertan aquí -->
    </div>
  </div>

  <!-- PÁGINA: REGISTRO -->
  <div id="register" class="page max-w-md mx-auto p-6">
    <div class="bg-white p-8 rounded-xl shadow-lg">
      <h2 class="text-2xl font-bold text-center mb-6 text-blue-800">Crear Cuenta</h2>
      <form onsubmit="alert('¡Cuenta creada! (ilustrativo)'); show('login'); return false;" class="space-y-4">
        <input type="text" placeholder="Nombre completo" required class="w-full p-3 border rounded-lg">
        <input type="text" placeholder="Dirección" required class="w-full p-3 border rounded-lg">
        <input type="text" placeholder="Compañía (opcional)" class="w-full p-3 border rounded-lg">
        <input type="tel" placeholder="Teléfono" required class="w-full p-3 border rounded-lg">
        <input type="email" placeholder="Correo electrónico" required class="w-full p-3 border rounded-lg">
        <input type="password" placeholder="Contraseña" required class="w-full p-3 border rounded-lg">
        <select class="w-full p-3 border rounded-lg">
          <option>Cliente minorista</option>
          <option>Cliente corporativo</option>
        </select>
        <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700">
          Registrarme
        </button>
      </form>
    </div>
  </div>

  <!-- PÁGINA: LOGIN -->
  <div id="login" class="page max-w-md mx-auto p-6">
    <div class="bg-white p-8 rounded-xl shadow-lg">
      <h2 class="text-2xl font-bold text-center mb-6 text-blue-800">Iniciar Sesión</h2>
      <form onsubmit="alert('¡Sesión iniciada! (ilustrativo)'); show('search'); return false;" class="space-y-4">
        <input type="email" placeholder="Correo" required class="w-full p-3 border rounded-lg">
        <input type="password" placeholder="Contraseña" required class="w-full p-3 border rounded-lg">
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
          Entrar
        </button>
      </form>
      <p class="text-center mt-4 text-sm text-gray-600">
        ¿Agente? Usa: <code>agent@aerolinea.com</code> / <code>123</code>
      </p>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script>
    // Cambiar páginas
    function show(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    // Vuelos de ejemplo
    const vuelos = [
      { id: 1, numero: "AR101", origen: "Ciudad de México", destino: "Guadalajara", salida: "2025-11-10 08:00", precio: 1250, asientos: 50 },
      { id: 2, numero: "AR102", origen: "Ciudad de México", destino: "Cancún", salida: "2025-11-11 14:30", precio: 2890, asientos: 40 },
      { id: 3, numero: "AR103", origen: "Guadalajara", destino: "Monterrey", salida: "2025-11-12 10:15", precio: 980, asientos: 60 }
    ];

    // Buscar vuelos
    function buscarVuelos() {
      const destino = document.getElementById('destino').value.toLowerCase();
      const resultados = document.getElementById('resultados');
      resultados.innerHTML = '';

      const filtrados = vuelos.filter(v => !destino || v.destino.toLowerCase().includes(destino));

      if (filtrados.length === 0) {
        resultados.innerHTML = '<p class="text-center text-gray-600">No se encontraron vuelos.</p>';
        return;
      }

      filtrados.forEach(v => {
        const card = document.createElement('div');
        card.className = 'flight-card bg-white p-6 rounded-xl shadow-md';
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <div>
              <p class="text-2xl font-bold text-blue-700">${v.numero}</p>
              <p class="text-lg">${v.origen} → ${v.destino}</p>
              <p class="text-gray-600">${new Date(v.salida).toLocaleString()}</p>
            </div>
            <div class="text-right">
              <p class="text-3xl font-bold text-green-600">$${v.precio}</p>
              <p class="text-sm text-gray-600">${v.asientos} asientos libres</p>
            </div>
          </div>
          <button onclick="alert('¡Reservado! (ilustrativo)')" 
                  class="mt-4 w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">
            Reservar Ahora
          </button>
        `;
        resultados.appendChild(card);
      });
    }

    // Cargar vuelos al inicio
    window.onload = () => buscarVuelos();
  </script>
</body>
</html>
